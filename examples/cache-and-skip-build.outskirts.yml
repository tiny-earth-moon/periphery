# yaml-language-server: $schema=https://raw.githubusercontent.com/tiny-earth-moon/outskirts/master/outskirts.schema.json
# Scenario: repeated local or CI scans that reuse a build already produced.
# Run: outskirts scan --config examples/cache-and-skip-build.outskirts.yml
# Expected: the build step is skipped and the index store at `index_store_path` is read
# as is (it implies skip_build; the explicit key is kept for clarity). Build it first
# with the same build options, e.g. `swift test` or `xcodebuild build`.
# For a SwiftPM project built with `swift test`, drop index_store_path:
# outskirts finds .build/out (Swift 6.4+) or <bin path>/index/store by itself.
skip_build: true
index_store_path:
  - /path/to/DerivedData/MyApp-abc123/Index.noindex/DataStore
# Unused Xcode build caches older than this are evicted at the end of a scan.
# Default 14, 0 disables eviction.
cache_max_age_days: 7
# The least recently used caches are also evicted above this total size.
# Default 20, 0 disables the limit.
cache_max_size_gb: 10
