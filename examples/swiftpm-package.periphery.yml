# Scenario: Swift package (no `project`, no `schemes`: Periphery builds every target).
# Run from the package root: periphery scan --config examples/swiftpm-package.periphery.yml
# Expected: an executable package reports everything not reachable from its
# entry points; for a library package, see library-public-api.periphery.yml.
# Arguments after `--` on the command line, or build_arguments here, go to `swift build`.
build_arguments:
  - -c
  - release
exclude_tests: true
report_exclude:
  - "Sources/**/Generated/**"
