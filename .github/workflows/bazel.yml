name: Bazel

on:
  pull_request: {}
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: bazel-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    name: macOS consumer scan
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - name: Verify the Bazel consumer
        run: swift Tests/BazelTests/Verify.swift
