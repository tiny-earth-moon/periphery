name: Test
on:
  push:
    branches:
      - master
  pull_request: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  macos:
    name: macOS (Xcode 27.2)
    # The `xcode-27` runner image is a GitHub preview image (runner-images#14404).
    # The "@State macro" retention tests are only conclusive under Xcode 27;
    # on an older Xcode they would not exercise the behaviour they guard.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: false
      - name: Lint
        run: |
          mise exec -- swiftformat --lint --quiet .
          mise exec -- swiftlint lint --quiet --strict
      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-xcode-27.2-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-27.2-spm-
      - name: Build
        run: swift build
      - name: Test
        run: swift test
